name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate
        run: python3 skills/project-skill-creator/scripts/validate_skill.py --all --strict skills examples
      - name: Test
        run: python3 -m unittest discover -s tests -v
      - name: Build upload-ready zip
        run: bash adapters/package.sh
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
