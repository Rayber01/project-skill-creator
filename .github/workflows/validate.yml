name: Validate

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: validate (py${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            python-version: "3.9"
          - os: ubuntu-26.04
            python-version: "3.11"
          - os: ubuntu-26.04
            python-version: "3.13"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Validate skills and examples
        run: python3 skills/project-skill-creator/scripts/validate_skill.py --all --strict skills examples
      - name: Unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Shell syntax
        run: |
          bash -n adapters/install.sh
          bash -n adapters/package.sh
          bash -n examples/release-checklist/scripts/preflight.sh
      - name: Install smoke test (dry run)
        run: bash adapters/install.sh --agent opencode,agents --project-dir "$(mktemp -d)" --dry-run
      - name: Package smoke test
        run: bash adapters/package.sh