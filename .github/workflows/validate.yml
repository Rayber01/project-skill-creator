name: Validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Validate skills and examples
        run: python3 skills/project-skill-creator/scripts/validate_skill.py --all --strict skills examples
      - name: Unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Shell syntax
        run: |
          bash -n adapters/install.sh
          bash -n adapters/package.sh
          bash -n examples/release-checklist/scripts/preflight.sh
      - name: Install smoke test (dry run)
        run: bash adapters/install.sh --agent opencode,agents --project-dir "$(mktemp -d)" --dry-run
      - name: Package smoke test
        run: bash adapters/package.sh
